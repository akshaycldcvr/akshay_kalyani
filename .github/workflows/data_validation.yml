name: MLOps Data Quality Pipeline

on:
  push:
    branches: [ mlops-poc ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Soda Core Postgres
        run: |
          python -m pip install --upgrade pip
          pip install soda-core-postgres psycopg2-binary

      - name: Run Soda Scan against Cloud Database
        env:
          POSTGRES_HOST: ${{ secrets.DB_HOST }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_NAME: ${{ secrets.DB_NAME }}
        run: |
          # Debug: print username and host length to verify secrets are loading
          echo "Connecting to host: ${POSTGRES_HOST}"
          echo "Using database user: ${POSTGRES_USER}"
          
          soda scan -d my_cloud_postgres -c configuration.yml checks.yml